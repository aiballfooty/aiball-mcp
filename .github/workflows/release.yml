name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Smoke test against the live API
        run: npm test

      - name: Build the MCPB bundle
        run: |
          npm ci --omit=dev
          npx -y @anthropic-ai/mcpb pack . aiball-mcp.mcpb

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" aiball-mcp.mcpb --title "$GITHUB_REF_NAME" --notes "AI Ball MCP server $GITHUB_REF_NAME. Download aiball-mcp.mcpb and open it in Claude Desktop, or see the README for other clients."

      - name: Fill in version, download URL and checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(sha256sum aiball-mcp.mcpb | cut -d' ' -f1)"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/aiball-mcp.mcpb"
          jq --arg v "$VERSION" --arg s "$SHA" --arg u "$URL" \
            '.version=$v | .packages[0].identifier=$u | .packages[0].fileSha256=$s' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
